name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - name: Ruff check
      run: uv run ruff check .
    - name: Ruff format
      run: uv run ruff format --check .
    - name: mypy
      run: uv run mypy flake8_simplify
    - name: flake8 (lint with flake8-simplify itself)
      run: uv run flake8 .
