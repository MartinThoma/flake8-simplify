[build-system]
build-backend = "uv_build"
requires = [
  "uv_build>=0.9,<0.13",
]

[project]
name = "flake8_simplify"
version = "0.30.0"
description = "flake8 plugin which checks for code that can be simplified"
keywords = [
  "flake8",
]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [{name = "Martin Thoma", email = "info@martin-thoma.de"}]
authors = [{name = "Martin Thoma", email = "info@martin-thoma.de"}]
requires-python = ">=3.10"
dependencies = [
  "flake8>=3.7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Framework :: Flake8",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.entry-points]
"flake8.extension" = {SIM = "flake8_simplify:Plugin"}

[project.urls]
Homepage = "https://github.com/MartinThoma/flake8-simplify"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "pytest-timeout",
  "ruff",
]
mutation = [
  "mutmut>=3",
]

[tool.uv.build-backend]
module-name = "flake8_simplify"
module-root = ""

[tool.mutmut]
paths_to_mutate = ["flake8_simplify/"]
tests_dir = ["tests/"]

[tool.mypy]
exclude = "build/lib/flake8_simplify.py"
ignore_missing_imports = true
strict = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
show_error_codes = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = [
    "testing.*",
    "tests.*",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=. --cov-report html:tests/reports/coverage-html --cov-report term-missing --ignore=docs/ --ignore=mutants/ --durations=3 --timeout=30"
doctest_encoding = "utf-8"

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "ERA", "F", "I", "ISC", "PT", "RSE", "UP"]
ignore = ["PT007", "ISC004"]

[tool.ruff.lint.isort]
known-first-party = ["flake8_simplify"]
combine-as-imports = true
